name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check minimum coverage
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')"
          echo "Total coverage: ${total}%"
          awk -v t="$total" -v min=80 'BEGIN { exit (t + 0 < min) }' || {
            echo "Coverage ${total}% is below 80%"
            exit 1
          }

      - name: Run benchmarks
        run: go test -run='^$' -bench=. -benchtime=1000x ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t go-newyear-api .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8080:8080 go-newyear-api
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS "http://localhost:8080/api/v1/days-until-new-year?date=2024-12-31" | grep -q '"days_left":1'
          docker logs api
          docker rm -f api
